
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RANGED REPORT</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: blue;
    margin: 0;
    padding: 15px;
}

.container {
    max-width: 850px;
    margin: auto;
    background: skyblue;
    padding: 20px;
    border-radius: 10px;
    color: black;
}

h2 {
    background: #2196F3;
    color: brown;
    text-align: center;
    padding: 15px;
    margin-top: 0;
}

h3 {
    margin-top: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin: 15px 0 5px;
    color: white;
}

.date-box {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.date-field {
    flex: 1;
    min-width: 200px;
}

input, button {
    padding: 11px;
    font-size: 15px;
    border-radius: 5px;
	
}

input {
    border: 1px solid red;
    width: 100%;
    color: green;
    background: pink;
}

button {
    background: #2196F3;
    color: black;
    border: 0;
    cursor: pointer;
    margin: 15px 5px 0 0;
	font-weight: bold;
}

#transactionButton {
    background: #16834a;
}

button:disabled {
    background: #888;
    cursor: wait;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-top: 20px;
}

.card {
    background: #eaf4ff;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    overflow-wrap: anywhere;
}

.card h3 {
    font-size: 14px;
    color: blue;
    margin-top: 0;
}

.amount {
    font-size: 21px;
    font-weight: bold;
    color: red;
}

.table-wrap {
    overflow-x: auto;
    margin-top: 20px;
	
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 400px;
    background: white;
    color: blue;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: left;
}

th {
    background: #2196F3;
    color: pink;
}

#message {
    margin-top: 15px;
    overflow-wrap: anywhere;
    font-weight: bold;
}

.report-section {
    display: none;
}

@media(max-width: 500px) {
    .container {
        padding: 12px;
    }

    .date-field {
        min-width: 100%;
    }

    button {
        width: 100%;
        margin-right: 0;
    }
}
</style>
</head>

<body>

<div class="container">

    <h2>DATE RANGE TO VIEW REPORT</h2>

    <!-- DATE RANGE -->

    <div class="date-box">

        <div class="date-field">
            <label for="fromDate">FROM DATE</label>
            <input type="date" id="fromDate" required>
        </div>

        <div class="date-field">
            <label for="toDate">TO DATE</label>
            <input type="date" id="toDate" required>
        </div>

    </div>

    <!-- REPORT BUTTONS -->

    <button type="button"
            id="amountButton"
            onclick="getReport('amount')">
        GET AMOUNT
    </button>

    <button type="button"
            id="transactionButton"
            onclick="getReport('transactions')">
        GET TRANSACTIONS
    </button>

    <p id="message">
        Please select From Date and To Date.
    </p>

    <!-- AMOUNT DETAILS ONLY -->

    <div class="cards report-section" id="amountSection">

        <div class="card">
            <h3>TOTAL CASH (Rs)</h3>
            <div class="amount" id="cash">0.00</div>
        </div>

        <div class="card">
            <h3>TOTAL UPI (Rs)</h3>
            <div class="amount" id="upi">0.00</div>
        </div>

        <div class="card">
            <h3>TOTAL CHEQUE (Rs)</h3>
            <div class="amount" id="cheque">0.00</div>
        </div>

        <div class="card">
            <h3>GRAND TOTAL PAYMENT RECEIVED (Rs)</h3>
            <div class="amount" id="grandTotal">0.00</div>
        </div>

    </div>

    <!-- ITEM WISE TRANSACTIONS ONLY -->

    <div class="report-section" id="transactionsSection">

        <h3>ITEM WISE TRANSACTIONS</h3>

        <div class="table-wrap">

            <table>

                <thead>
                    <tr>
                        <th>Service Type / Item</th>
                        <th>Transactions</th>
                        <th>Total Amount (Rs)</th>
                    </tr>
                </thead>

                <tbody id="serviceRows">
                    <tr>
                        <td colspan="3">
                            Click GET TRANSACTIONS.
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

// ======================================
// APPS SCRIPT URL
// ======================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwMV8c8GGu3BWw14Oeaf4qL6wD0-NDzuRvvbgccHas_tXfJt3lq2UOTHqOiXv3b_UPcrQ/exec";

let activeScript = null;
let activeCallback = null;
let reportTimeout = null;


// ======================================
// MESSAGE
// ======================================

function showMessage(message) {
    document.getElementById("message").textContent = message;
}


// ======================================
// HIDE BOTH REPORT SECTIONS
// ======================================

function hideReports() {

    document.getElementById("amountSection").style.display = "none";

    document.getElementById("transactionsSection").style.display = "none";

}


// ======================================
// RESET AMOUNT DETAILS
// ======================================

function resetAmount() {

    document.getElementById("cash").textContent = "0.00";
    document.getElementById("upi").textContent = "0.00";
    document.getElementById("cheque").textContent = "0.00";
    document.getElementById("grandTotal").textContent = "0.00";

}


// ======================================
// CLEANUP PREVIOUS REQUEST
// ======================================

function cleanupRequest() {

    if (reportTimeout !== null) {

        clearTimeout(reportTimeout);
        reportTimeout = null;

    }

    if (activeCallback) {

        delete window[activeCallback];
        activeCallback = null;

    }

    if (activeScript) {

        activeScript.remove();
        activeScript = null;

    }

    document.getElementById("amountButton").disabled = false;

    document.getElementById("transactionButton").disabled = false;

}


// ======================================
// GET REPORT
// ======================================

function getReport(mode) {

    const fromDate =
        document.getElementById("fromDate").value;

    const toDate =
        document.getElementById("toDate").value;


    // DATE VALIDATION

    if (!fromDate || !toDate) {

        showMessage("Please select From Date and To Date.");
        return;

    }

    if (fromDate > toDate) {

        showMessage("From Date cannot be greater than To Date.");
        return;

    }

    if (mode !== "amount" && mode !== "transactions") {

        showMessage("Invalid report selection.");
        return;

    }


    // CANCEL PREVIOUS REQUEST

    cleanupRequest();

    hideReports();

    document.getElementById("amountButton").disabled = true;

    document.getElementById("transactionButton").disabled = true;


    showMessage(
        mode === "amount"
        ? "Loading Amount Details..."
        : "Loading Item Wise Transactions..."
    );


    // CREATE CALLBACK

    const callbackName =
        "reportCallback_" +
        Date.now() +
        "_" +
        Math.floor(Math.random() * 100000);

    activeCallback = callbackName;

    activeScript = document.createElement("script");

    const thisScript = activeScript;

    const thisCallback = callbackName;


    // REQUEST TIMEOUT

    reportTimeout = setTimeout(function() {

        if (activeCallback !== thisCallback) return;

        cleanupRequest();

        showMessage(
            "Request timed out. Check Apps Script URL and deployment."
        );

    }, 30000);


    // ======================================
    // JSONP CALLBACK
    // ======================================

    window[callbackName] = function(data) {

        if (activeCallback !== thisCallback) return;

        cleanupRequest();


        // RESPONSE VALIDATION

        if (!data || data.status !== "success") {

            showMessage(
                data && data.message
                ? "Report Error: " + data.message
                : "Invalid response from Apps Script."
            );

            return;

        }


        // ======================================
        // GET AMOUNT
        // ======================================

        if (mode === "amount") {

            document.getElementById("cash").textContent =
                Number(data.cash || 0).toFixed(2);

            document.getElementById("upi").textContent =
                Number(data.upi || 0).toFixed(2);

            document.getElementById("cheque").textContent =
                Number(data.cheque || 0).toFixed(2);

            document.getElementById("grandTotal").textContent =
                Number(data.grandTotal || 0).toFixed(2);


            // SHOW AMOUNT SECTION ONLY

            document.getElementById("amountSection").style.display = "grid";

            document.getElementById("transactionsSection").style.display = "none";


            showMessage(
                "Amount Details Loaded Successfully. From " +
                fromDate + " To " + toDate
            );

        }


        // ======================================
        // GET ITEM WISE TRANSACTIONS
        // ======================================

        else if (mode === "transactions") {

            const tbody =
                document.getElementById("serviceRows");

            tbody.replaceChildren();


            if (!Array.isArray(data.services) ||
                data.services.length === 0) {

                const tr = document.createElement("tr");

                const td = document.createElement("td");

                td.colSpan = 3;

                td.textContent =
                    "No transactions found between " +
                    fromDate + " and " + toDate + ".";

                tr.appendChild(td);

                tbody.appendChild(tr);

            }

            else {

                data.services.forEach(function(item) {

                    const tr = document.createElement("tr");

                    const values = [

                        item.serviceType || "",

                        Number(item.transactions || 0),

                        Number(item.totalAmount || 0).toFixed(2)

                    ];


                    values.forEach(function(value) {

                        const td = document.createElement("td");

                        td.textContent = value;

                        tr.appendChild(td);

                    });


                    tbody.appendChild(tr);

                });

            }


            // SHOW TRANSACTIONS SECTION ONLY

            document.getElementById("transactionsSection").style.display = "block";

            document.getElementById("amountSection").style.display = "none";


            showMessage(
                "Item Wise Transactions Loaded Successfully. " +
                "Total Transactions: " +
                Number(data.transactions || 0) +
                " | From " + fromDate + " To " + toDate
            );

        }

    };


    // ======================================
    // SCRIPT ERROR
    // ======================================

    thisScript.onerror = function() {

        if (activeCallback !== thisCallback) return;

        cleanupRequest();

        showMessage(
            "Failed to connect to Apps Script. " +
            "Check Web App URL and deployment access."
        );

    };


    // ======================================
    // JSONP REQUEST
    // ======================================

    thisScript.src =
        SCRIPT_URL +
        "?action=report" +
        "&fromDate=" + encodeURIComponent(fromDate) +
        "&toDate=" + encodeURIComponent(toDate) +
        "&callback=" + encodeURIComponent(callbackName) +
        "&_=" + Date.now();


    document.body.appendChild(thisScript);

}

</script>

</body>
</html>
