
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report View</title>


    <style>

        /* =========================
           BODY
        ========================= */

        body {

            font-family: Arial, sans-serif;

            margin: 0;

            background: #f2f2f2;

        }


        /* =========================
           HEADER
        ========================= */

        header {

            background: #2196F3;

            color: white;

            padding: 18px;

            text-align: center;

        }


        /* =========================
           BUTTONS
        ========================= */

        .query-button,
        .back-button,
        .report-button {

            margin: 10px 5px;

            padding: 10px 20px;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;

        }


        .query-button {

            background: orange;

        }


        .report-button {

            background: green;

        }


        .back-button {

            background: #2196F3;

        }


        button:hover {

            opacity: 0.85;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            padding: 20px;

            overflow-x: auto;

        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            display: none;

            text-align: center;

            font-size: 20px;

            padding: 30px;

        }


        .loader {

            width: 40px;

            height: 40px;

            border: 5px solid #ddd;

            border-top: 5px solid #2196F3;

            border-radius: 50%;

            margin: 10px auto;

            animation: spin 1s linear infinite;

        }


        @keyframes spin {

            0% {

                transform: rotate(0deg);

            }

            100% {

                transform: rotate(360deg);

            }

        }


        /* =========================
           TABLE CONTAINER
        ========================= */

        .table-container {

            overflow-x: auto;

            margin-top: 20px;

        }


        /* =========================
           TABLE
        ========================= */

        table {

            width: 100%;

            border-collapse: collapse;

            background: white;

        }


        th {

            background: #333;

            color: white;

            padding: 12px;

            border: 1px solid #ddd;

            white-space: nowrap;

        }


        td {

            padding: 10px;

            border: 1px solid #ddd;

            text-align: left;

        }


        tr:nth-child(even) {

            background: #f9f9f9;

        }


        tr:hover {

            background: #eeeeee;

        }


        /* =========================
           MOBILE
        ========================= */

        @media screen and (max-width: 700px) {

            th,
            td {

                padding: 8px;

                font-size: 13px;

            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>Ankit Telecommunication</h1>

    <h2>User Registration Report</h2>

</header>



<!-- =========================
     BUTTONS
========================= -->


<!-- QUERY BUTTON -->

<button
    type="button"
    class="query-button"
    onclick="window.location.href='Query.html'">

    Query

</button>



<!-- LOAD REPORT BUTTON -->

<button
    type="button"
    class="report-button"
    onclick="loadReport()">

    Load Report

</button>



<!-- =========================
     CONTAINER
========================= -->

<div class="container">


    <!-- =========================
         LOADING
    ========================= -->

    <div
        id="loading"
        class="loading">

        <div class="loader"></div>

        Loading Report...

    </div>



    <!-- =========================
         TABLE
    ========================= -->

    <div class="table-container">

        <table
            id="reportTable"
            style="display:none;">

            <thead>

                <tr>

                    <th>User ID</th>

                    <th>Full Name</th>

                    <th>Father Name</th>

                    <th>Mobile</th>

                    <th>Email</th>

                    <th>Address</th>

                </tr>

            </thead>


            <tbody
                id="reportBody">

            </tbody>

        </table>

    </div>


</div>



<!-- =========================
     BACK BUTTON
========================= -->

<button
    type="button"
    class="back-button"
    onclick="window.location.href='home.html'">

    Back To Home

</button>



<script>

// =================================
// GOOGLE APPS SCRIPT URL
// =================================

var SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzGkzHhuOxfrDYno1GADTf3Vq1HTQY8VjNswcMR0YmDiTfCNyVTdroVBn6Zu6UXZSYIPA/exec";



// =================================
// LOAD REPORT
// =================================

function loadReport() {


    // =================================
    // SHOW LOADING
    // =================================

    document
        .getElementById("loading")
        .style.display = "block";


    // Hide old table

    document
        .getElementById("reportTable")
        .style.display = "none";


    // Clear old data

    document
        .getElementById("reportBody")
        .innerHTML = "";



    // =================================
    // CREATE URL
    // =================================

    var url =
        SCRIPT_URL +
        "?action=report";



    // =================================
    // FETCH GOOGLE SHEET DATA
    // =================================

    fetch(url)

        .then(function(response) {


            if (!response.ok) {

                throw new Error(
                    "HTTP Error: " +
                    response.status
                );

            }


            return response.json();

        })


        .then(function(data) {


            // =================================
            // HIDE LOADING
            // =================================

            document
                .getElementById("loading")
                .style.display = "none";



            // =================================
            // SUCCESS
            // =================================

            if (
                data.status === "success"
            ) {


                var tbody =
                    document
                    .getElementById("reportBody");


                tbody.innerHTML = "";



                // =================================
                // DISPLAY RECORDS
                // =================================

                data.records.forEach(
                    function(row) {


                        var tr =
                            document.createElement("tr");


                        tr.innerHTML =

                            "<td>" +
                            escapeHTML(row.userId) +
                            "</td>" +

                            "<td>" +
                            escapeHTML(row.fullName) +
                            "</td>" +

                            "<td>" +
                            escapeHTML(row.fatherName) +
                            "</td>" +

                            "<td>" +
                            escapeHTML(row.mobile) +
                            "</td>" +

                            "<td>" +
                            escapeHTML(row.email) +
                            "</td>" +

                            "<td>" +
                            escapeHTML(row.address) +
                            "</td>";


                        tbody.appendChild(tr);

                    }
                );



                // =================================
                // SHOW TABLE
                // =================================

                document
                    .getElementById("reportTable")
                    .style.display = "table";


            }


            // =================================
            // ERROR FROM APPS SCRIPT
            // =================================

            else {


                alert(
                    data.message ||
                    "Unable to load report"
                );

            }

        })


        // =================================
        // CONNECTION ERROR
        // =================================

        .catch(function(error) {


            document
                .getElementById("loading")
                .style.display = "none";


            console.log(error);


            alert(
                "Connection Error"
            );

        });

}



// =================================
// HTML SECURITY
// =================================

function escapeHTML(value) {


    var div =
        document.createElement("div");


    div.textContent =
        value == null ? "" : value;


    return div.innerHTML;

}



</script>


</body>

</html>
