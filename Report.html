<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report View</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        header {
            background: #2196F3;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .container {
            padding: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #333;
            color: white;
            padding: 12px;
            border: 1px solid #ddd;
        }

        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .loading {
            text-align: center;
            font-size: 20px;
            padding: 30px;
        }

        .back-button {
            margin: 20px;
            padding: 10px 20px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

	

    </style>

</head>


<body>


<header>

    <h1>Ankit Telecommunication</h1>

    <h2>User Registration Report</h2>

</header>
 

<button class="back-button"
        onclick="window.location.href='home.html'">

    Back To Home

</button>

	<button class="report-button"
        onclick="window.location.href=loadReport();">

    Load Report

</button>

<div class="container">

    <div id="loading"
         class="loading">

        Loading Report...

    </div>


    <table id="reportTable"
           style="display:none;">

        <thead>

            <tr>
				<th>User ID</th>
				<th>Password</th>
                <th>Full Name</th>
                <th>Father Name</th>
                <th>Mobile</th>
                <th>Email</th>
                <th>Address</th>
                

            </tr>

        </thead>


        <tbody id="reportBody">

        </tbody>

    </table>

</div>


<script>


// Google Apps Script URL

var SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwe56F7l-dlwAWYMBPUK3o9ZeVMS3oI0wvlxy2nhaIGiLOFXjQ0_5I932GNk03iJo2oqw/exec";


// Load Report

function loadReport() {


    var url =
        SCRIPT_URL +
        "?action=report";


    fetch(url)

        .then(function(response) {

            return response.json();

        })


        .then(function(data) {


            document.getElementById("loading")
                .style.display = "none";


            if (data.status === "success") {


                var tbody =
                    document.getElementById("reportBody");


                tbody.innerHTML = "";


                data.records.forEach(function(row) {


                    var tr =
                        document.createElement("tr");


                    tr.innerHTML =
						
						"<td>" + row.userId + "</td>" +
						
						"<td>" + Password + "</td>" +
						
                        "<td>" + row.fullName + "</td>" +

                        "<td>" + row.fatherName + "</td>" +

                        "<td>" + row.mobile + "</td>" +

                        "<td>" + row.email + "</td>" +

                        "<td>" + row.address + "</td>";

                       
                    tbody.appendChild(tr);

                });


                document.getElementById("reportTable")
                    .style.display = "table";


            } else {


                alert(data.message);

            }

        })


        .catch(function(error) {


            document.getElementById("loading")
                .style.display = "none";


            alert("Unable to load report");

            console.log(error);

        });

}


// Load automatically

 loadReport();


</script>


</body>

</html>
