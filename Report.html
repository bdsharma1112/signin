<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Report View</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }


        header {
            background: #2196F3;
            color: white;
            padding: 18px;
            text-align: center;
        }


        .container {
            padding: 20px;
            overflow-x: auto;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }


        th {
            background: #333;
            color: white;
            padding: 12px;
            border: 1px solid #ddd;
        }


        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }


        tr:nth-child(even) {
            background: #f9f9f9;
        }


        .loading {
            display: none;
            text-align: center;
            font-size: 20px;
            padding: 30px;
        }


        .back-button,
        .report-button {
            margin: 20px 5px;
            padding: 10px 20px;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }


        .back-button {
            background: #2196F3;
        }


        .report-button {
            background: green;
        }

    </style>

</head>


<body>


<header>

    <h1>Ankit Telecommunication</h1>

    <h2>User Registration Report</h2>

</header>


<button class="back-button"
        onclick="window.location.href='home.html'">

    Back To Home

</button>


<button class="report-button"
        onclick="loadReport();">

    Load Report

</button>


<div class="container">


    <div id="loading"
         class="loading">

        Loading Report...

    </div>


    <table id="reportTable"
           style="display:none;">

        <thead>

            <tr>

                <th>User ID</th>

                <th>Password</th>

                <th>Full Name</th>

                <th>Father Name</th>

                <th>Mobile</th>

                <th>Email</th>

                <th>Address</th>

            </tr>

        </thead>


        <tbody id="reportBody">

        </tbody>

    </table>


</div>


<script>


// =================================
// GOOGLE APPS SCRIPT URL
// =================================

var SCRIPT_URL =
"https://script.google.com/macros/s/AKfycby7-ELUe4bn_qX_6YW2_Z94Iccbfd0BKieq2kvVH8eZSJyhmRCMX1NUCRIEQ3MMulcJTg/exec";


// =================================
// LOAD REPORT
// =================================

function loadReport() {


    // Show loading

    document.getElementById("loading")
        .style.display = "block";


    document.getElementById("reportTable")
        .style.display = "none";


    var url =
        SCRIPT_URL +
        "?action=report";


    fetch(url)


        .then(function(response) {

            return response.json();

        })


        .then(function(data) {


            document.getElementById("loading")
                .style.display = "none";


            if (data.status === "success") {


                var tbody =
                    document.getElementById("reportBody");


                tbody.innerHTML = "";


                data.records.forEach(function(row) {


                    var tr =
                        document.createElement("tr");


                    tr.innerHTML =

                        "<td>" +
                        row.userId +
                        "</td>" +

                        "<td>" +
                        row.password +
                        "</td>" +

                        "<td>" +
                        row.fullName +
                        "</td>" +

                        "<td>" +
                        row.fatherName +
                        "</td>" +

                        "<td>" +
                        row.mobile +
                        "</td>" +

                        "<td>" +
                        row.email +
                        "</td>" +

                        "<td>" +
                        row.address +
                        "</td>";


                    tbody.appendChild(tr);

                });


                document.getElementById("reportTable")
                    .style.display = "table";


            }

            else {

                alert(data.message);

            }

        })


        .catch(function(error) {


            document.getElementById("loading")
                .style.display = "none";


            alert("Unable to load report");


            console.log(error);

        });

}


// =================================
// LOAD AUTOMATICALLY
// =================================

// यदि page खुलते ही report चाहिए,
// तो नीचे वाली line रहने दें.

//loadReport();


</script>


</body>

</html>
