<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bhartpur CSC Registration Form</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: skyblue;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 650px;
    margin: auto;
    background: blue;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 10px #ccc;
}

h2 {
    text-align: center;
    background: green;
    color: yellow;
    padding: 15px;
    margin-top: 0;
    border-radius: 5px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    color: white;
    background: transparent;
}

input[type="date"],
input[type="text"],
input[type="tel"],
input[type="number"],
select {
    width: 100%;
    padding: 11px;
    margin-top: 8px;
    border: 1px solid pink;
    border-radius: 6px;
    font-size: 15px;
    color: red;
    background: yellow;
}

.payment-options {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.payment-options label {
    margin-top: 0;
    font-weight: normal;
    display: flex;
    align-items: center;
    gap: 6px;
}

.payment-options input {
    width: auto;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.submit-btn {
    background: #2196F3;
}

.back-btn {
    background: #666;
}


#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    color: pink;
    overflow-wrap: anywhere;
}

@media (max-width: 480px) {
    .container {
        padding: 15px;
    }

    .buttons {
        flex-direction: column;
    }
}
</style>
	 <script>

	if (sessionStorage.getItem("loginStatus") !== "success") {

   	 window.location.href = "index.html";

	}

	</script>
</head>

<body>

<div class="container">

<h2>Bhartpur CSC Registration Form</h2>

<form id="registrationForm">

    <label for="date">DATE *</label>
    <input type="date" id="date" name="date" required>

    <label for="customerName">CUSTOMER NAME *</label>
    <input type="text" id="customerName" name="customerName"
           placeholder="Enter Customer Name" required>

    <label for="mobileNo">NEW MOBILE NO *</label>
    <input type="tel" id="mobileNo" name="mobileNo"
           placeholder="Enter 10 Digit Mobile Number"
           maxlength="10" pattern="[0-9]{10}"
		   maxlength="10"
		   minlength="10"
		   pattern="[6-9][0-9]{9}"
		   title="Enter valid 10 digit Indian mobile number starting with 6, 7, 8 or 9"
		   inputmode="numeric" required>
		   

    <label for="simNo">SIM NO</label>
    <input type="text" id="simNo" name="simNo"
           placeholder="Enter SIM Number">

    <label for="serviceType">SERVICE TYPE *</label>
    <select id="serviceType" name="serviceType" required>
        <option value="">Select Service Type</option>
        <option value="CYMN SIM">CYMN SIM</option>
        <option value="PREPAID MNP">PREPAID MNP</option>
        <option value="POST PAID MNP">POST PAID MNP</option>
        <option value="SWAP">SWAP</option>
		<option value="SIM UPGRADE">SIM UPGRADE</option>
        <option value="Recharge Top Up">Recharge Top Up</option>
        <option value="PREPAID NUMBER PROVISIONING (PAIRING)">PREPAID NUMBER PROVISIONING (PAIRING)</option>
		<option value="PRE TO POST">PRE TO POST</option>
        <option value="POST TO PRE">POST TO PRE</option>
		<option value="CUG">CUG</option>
        <option value="FANCY">FANCY</option>
        <option value="Bill Deposit">Bill Deposit</option>
    	<option value="Adhar Customer Application Form">Adhar Customer Application Form</option>
		<option value="PRINT">PRINT</option>
		<option value="PRINT RETURNED">PRINT RETURNED</option>
    </select>

    <label for="amount">PAYMENT RECEIVED (Rs) *</label>
    <input type="number" id="amount" name="amount"
           placeholder="Enter Amount Received"
           min="0" step="0.01" required>

    <label>PAYMENT MODE *</label>
    <div class="payment-options">
        <label>
            <input type="radio" name="paymentMode" value="Cash" required>
            Cash
        </label>

        <label>
            <input type="radio" name="paymentMode" value="UPI" required>
            UPI
        </label>

        <label>
            <input type="radio" name="paymentMode" value="Cheque" required>
            Cheque
        </label>
    </div>

    <label for="cscName">NAME OF CSC *</label>
    <select id="cscName" name="cscName" required>
        <option value="">Select CSC</option>
        <option value="Krishana Nagar Bhartpur Rajasthan">
            Krishana Nagar Bhartpur Rajasthan
        </option>
        <option value="Vaishali Nagar Ajmer">
            Vaishali Nagar Ajmer
        </option>
    </select>

    <div class="buttons">
        <button type="submit" class="submit-btn">SUBMIT</button>

        <button type="button" class="back-btn"
                onclick="goBack()">BACK</button>

    </div>

    <p id="message" role="status" aria-live="polite"></p>

</form>
</div>

<script>
// IMPORTANT:
// Use the SAME Apps Script deployment URL as the report
// if both forms must use the same Google Sheet.

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw_LgeiNYF4cL8EyBZ4fOWZHymbD7Zu4H9GMk64NXvYyhqdrCauIa267vQM1-zZ7ws/exec";

const form = document.getElementById("registrationForm");
const message = document.getElementById("message");
const submitButton = form.querySelector(".submit-btn");


function goBack() {
    window.history.back();
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    if (!form.reportValidity()) {
        return;
    }

    const paymentMode = form.querySelector(
        'input[name="paymentMode"]:checked'
    );

    if (!paymentMode) {
        message.textContent = "Please select Payment Mode.";
        return;
    }

    const data = {
        date: document.getElementById("date").value,
        customerName: document.getElementById("customerName").value.trim(),
        mobileNo: document.getElementById("mobileNo").value.trim(),
        simNo: document.getElementById("simNo").value.trim(),
        serviceType: document.getElementById("serviceType").value,
        amount: document.getElementById("amount").value,
        paymentMode: paymentMode.value,
        cscName: document.getElementById("cscName").value
    };

    if (!/^[0-9]{10}$/.test(data.mobileNo)) {
        message.textContent =
            "Mobile number must contain exactly 10 digits.";
        return;
    }

    submitButton.disabled = true;
    message.textContent = "Saving Registration...";

    const body = new URLSearchParams(data);

    fetch(SCRIPT_URL, {
        method: "POST",
        body: body
    })
    .then(function(response) {
        return response.json();
    })
    .then(function(result) {

        if (result.status === "success") {

            // CLEAR COMPLETE FORM
            form.reset();

            message.textContent =
                "Registration Saved Successfully!";

        } else {
            message.textContent =
                result.message || "Registration could not be saved.";
        }

    })
    .catch(function(error) {
        console.error(error);

        message.textContent =
            "Error! Registration status could not be confirmed.";
    })
    .finally(function() {
        submitButton.disabled = false;
    });
});

</script>

</body>
</html>
