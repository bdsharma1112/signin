
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bhartpur CSC Registration Form</title>

<style>
* {
    box-sizing: border-box;
	background: white
}

body {
    font-family: Arial, sans-serif;
    background: skyblue;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 650px;
    margin: auto;
    background: blue;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 2px 10px #ccc;
}

h2 {
    text-align: center;
    background: green;
    color: yellow;
    padding: 15px;
    margin-top: 0;
    border-radius: 5px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 20px;
	color: white;
	background: black;

}

input[type="date"],
input[type="text"],
input[type="tel"],
input[type="number"],

select {
    width: 100%;
    padding: 11px;
    margin-top: 11px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 14px;
	color: red;
	background: white;
}

.payment-options {
    margin-top: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.payment-options label {
    margin-top: 0;
    font-weight: normal;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 25px;
}

button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.submit-btn {
    background: #2196F3;
}

.back-btn {
    background: #666;
}

.edit-btn {
    background: #ff9800;
}

#message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

@media (max-width: 480px) {
    .container {
        padding: 15px;
    }

    .buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

<h2>Bhartpur CSC Registration Form</h2>

<form id="registrationForm">

	<label for="date">DATE *</label>
	<input type="date" id="date" name="date" required>
	    <label for="customerName">CUSTOMER NAME *</label>
    <input type="text" id="customerName" name="customerName"
           placeholder="Enter Customer Name" required>

    <label for="mobileNo">NEW MOBILE NO *</label>
    <input type="tel" id="mobileNo" name="mobileNo"
           placeholder="Enter 10 Digit Mobile Number"
           maxlength="10" pattern="[0-9]{10}" required>

    <label for="simNo">SIM NO</label>
    <input type="text" id="simNo" name="simNo"
           placeholder="Enter SIM Number">

    <label for="serviceType">SERVICE TYPE *</label>
    <select id="serviceType" name="serviceType" required>
        <option value="">Select Service Type</option>
        <option>NEW PREPAID</option>
        <option>POST PAID MNP</option>
        <option>PREPAID MNP</option>
        <option>PRE TO POST</option>
        <option>POST TO PRE</option>
        <option>SWAP</option>
        <option>PRINT</option>
        <option>Adhar Customer Application Form</option>
        <option>Recharge Top Up</option>
        <option>PREPAID NUMBER PROVISIONING (PAIRING)</option>
        <option>CUG</option>
        <option>FANCY</option>
        <option>Bill Deposit</option>
        <option>PRINT RETURNED</option>
    </select>

    <label for="amount">PAYMENT RECEIVED (Rs) *</label>
    <input type="number" id="amount" name="amount"
           placeholder="Enter Amount Received"
           min="0" step="0.01" required>

    <label>PAYMENT MODE *</label>
    <div class="payment-options">
        <label>
            <input type="checkbox" name="paymentMode" value="Cash">
            Cash
        </label>

        <label>
            <input type="checkbox" name="paymentMode" value="UPI">
            UPI
        </label>

        <label>
            <input type="checkbox" name="paymentMode" value="Cheque">
            Cheque
        </label>
    </div>

    <label for="cscName">NAME OF CSC *</label>
    <select id="cscName" name="cscName" required>
        <option value="">Select CSC</option>
        <option>Krishana Nagar Bhartpur Rajasthan</option>
        <option>Vaishali Nagar Ajmer</option>
    </select>

    <div class="buttons">
        <button type="submit" class="submit-btn">SUBMIT</button>
        <button type="button" class="back-btn"
                onclick="goBack()">BACK</button>
        <button type="button" class="edit-btn"
                onclick="enableEdit()">EDIT</button>
    </div>

    <p id="message"></p>

</form>
</div>

<script>
var form = document.getElementById("registrationForm");
var isEditMode = true;

function enableEdit() {
    var fields = form.querySelectorAll("input, select");

    fields.forEach(function(field) {
        field.disabled = false;
    });

    isEditMode = true;

    document.getElementById("message").textContent =
        "Edit mode enabled.";
}

function goBack() {
    window.history.back();
}


const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8SecM8m9ZqAzPEAZaFy4cXi_DrPZETxhbGPcPN5gw96ytPw0nBotALpXe4jEvpRT9/exec";

var form = document.getElementById("registrationForm");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    var paymentModes = form.querySelectorAll(
        'input[name="paymentMode"]:checked'
    );

    if (paymentModes.length === 0) {
        document.getElementById("message").textContent =
            "Please select Payment Mode.";
        return;
    }

    var data = {
		
        customerName: document.getElementById("customerName").value.trim(),
        mobileNo: document.getElementById("mobileNo").value.trim(),
        simNo: document.getElementById("simNo").value.trim(),
        serviceType: document.getElementById("serviceType").value,
        amount: document.getElementById("amount").value,
        paymentMode: Array.from(paymentModes).map(function(item) {
            return item.value;
        }).join(", "),
        cscName: document.getElementById("cscName").value,
		
		date: document.getElementById("date").value,
	
    };

    var message = document.getElementById("message");
    var submitButton = form.querySelector(".submit-btn");

    submitButton.disabled = true;
    message.textContent = "Submitting registration...";

    fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: new URLSearchParams(data)
    })
    .then(function() {
        message.textContent =
            "Request succesfully submitted";

        form.reset();
    })
    .catch(function(error) {
        message.textContent =
            "Network error. Please check your connection and Google Apps Script URL.";
        console.error(error);
    })
    .finally(function() {
        submitButton.disabled = false;
    });
});


  </script>

</body>
</html>
