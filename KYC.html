
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KYC Data Collection Form</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f2f2f2;
}

header {
    background: #2196F3;
    color: white;
    text-align: center;
    padding: 20px;
}

header h1, header p { margin: 5px; }

.container {
    width: 90%;
    max-width: 800px;
    margin: 25px auto;
}

.form-section, .location-section {
    background: white;
    margin-bottom: 20px;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 8px #bbb;
}

.section-title, .location-section h2 {
    background: #2196F3;
    color: white;
    padding: 10px;
    border-radius: 5px;
    margin-top: 0;
}

.form-row {
    display: flex;
    gap: 20px;
}

.form-group {
    flex: 1;
    min-width: 0;
}

label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    font-weight: bold;
}

input, select, textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #aaa;
    border-radius: 5px;
    font-size: 15px;
}

textarea {
    height: 90px;
    resize: vertical;
}

.required { color: red; }

.location-section, .photo-section { text-align: center; }

.location-status {
    margin-top: 15px;
    font-weight: bold;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

#camera {
    width: 100%;
    max-width: 500px;
    border-radius: 10px;
    background: black;
}

#photoPreview {
    display: none;
    width: 180px;
    height: 220px;
    object-fit: cover;
    border-radius: 10px;
    margin: 15px auto;
    border: 2px solid #2196F3;
}

.buttons {
    text-align: center;
    margin: 20px 0;
}

button {
    padding: 12px 25px;
    margin: 5px;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover { opacity: 0.85; }
button:disabled { opacity: 0.6; cursor: not-allowed; }

.submit-button, .capture-button { background: green; }
.reset-button, .retake-button { background: #ff9800; }
.back-button, .location-button, .camera-button {
    background: #2196F3;
}

.camera-button {
    font-size: 28px;
    border-radius: 50%;
    width: 65px;
    height: 65px;
    padding: 0;
}

#message {
    text-align: center;
    font-weight: bold;
    margin: 15px;
    overflow-wrap: anywhere;
}

.loading {
    display: none;
    text-align: center;
    color: #2196F3;
    font-weight: bold;
    margin: 15px;
}

@media screen and (max-width: 600px) {
    .container { width: 95%; }
    .form-row { display: block; }
    header h1 { font-size: 24px; }
    button { max-width: 100%; }
}
</style>
</head>

<body>

<header>
    <h1>KYC</h1>
    <p>Data Collection Form</p>
    <p>Please Submit KYC</p>
</header>

<div class="container">
<form id="dataForm">

    <div class="form-section">
        <h2 class="section-title">Personal Details</h2>

        <div class="form-row">
            <div class="form-group">
                <label for="fullName">Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" required placeholder="Enter Full Name">
            </div>
            <div class="form-group">
                <label for="fatherName">Father Name <span class="required">*</span></label>
                <input type="text" id="fatherName" required placeholder="Enter Father Name">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender">
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
        </div>
    </div>

    <div class="form-section">
        <h2 class="section-title">Contact Details</h2>

        <div class="form-row">
            <div class="form-group">
                <label for="mobile">Mobile Number <span class="required">*</span></label>
                <input type="tel" id="mobile" maxlength="10"
                       inputmode="numeric" required
                       placeholder="10 Digit Mobile Number">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter Email">
            </div>
        </div>

        <label for="address">Address <span class="required">*</span></label>
        <textarea id="address" required placeholder="Enter Complete Address"></textarea>

        <div class="form-row">
            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" placeholder="Enter City">
            </div>
            <div class="form-group">
                <label for="district">District</label>
                <input type="text" id="district" placeholder="Enter District">
            </div>
            <div class="form-group">
                <label for="pincode">PIN Code</label>
                <input type="text" id="pincode" maxlength="6"
                       inputmode="numeric" placeholder="Enter PIN Code">
            </div>
        </div>
    </div>

    <div class="form-section">
        <h2 class="section-title">Additional Details</h2>

        <label for="occupation">Occupation</label>
        <select id="occupation">
            <option value="">Select Occupation</option>
            <option>Business</option>
            <option>Private Job</option>
            <option>Government Job</option>
            <option>Student</option>
            <option>Other</option>
        </select>

        <label for="remarks">Remarks</label>
        <textarea id="remarks" placeholder="Enter Remarks"></textarea>
    </div>

    <div class="form-section photo-section">
        <h2 class="section-title">Capture Photo</h2>

        <label>Applicant Photo <span class="required">*</span></label>

        <video id="camera" autoplay playsinline style="display:none"></video>
        <canvas id="photoCanvas" style="display:none"></canvas>
        <img id="photoPreview" alt="Photo Preview">

        <br>

        <button type="button" class="camera-button"
                onclick="startCamera()" title="Open Camera">📷</button>

        <br>

        <button type="button" class="capture-button"
                onclick="capturePhoto()">CAPTURE PHOTO</button>

        <button type="button" class="retake-button"
                onclick="retakePhoto()">RETAKE</button>
    </div>

    <div class="location-section">
        <h2>📍 Current Location</h2>

        <button type="button" class="location-button"
                onclick="getLocation()">📍 GET CURRENT LOCATION</button>

        <p id="locationStatus" class="location-status">
            Location not captured
        </p>

        <input type="hidden" id="latitude">
        <input type="hidden" id="longitude">
    </div>

    <div id="loading" class="loading">⏳ Submitting data...</div>
    <div id="message" role="status" aria-live="polite"></div>

    <div class="buttons">
        <button type="submit" id="submitButton" class="submit-button">
            SUBMIT
        </button>

        <button type="reset" class="reset-button">RESET</button>

        <button type="button" class="back-button"
                onclick="window.location.href='home.html'">BACK</button>
    </div>

</form>
</div>

<script>
"use strict";

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw2Jwn6SlMicaYC_iYtUPnpj13nl_YFOoeQ_h0WnVrMe7gBqC1Kp9e1F8zEnwNgZBvnOg/exec";

const DRIVE_FOLDER_ID = "1qB7JA7JqWCXvMfmyHROl723HRGjoOh4j";

let cameraStream = null;
let photoData = "";
let isSubmitting = false;

const form = document.getElementById("dataForm");
const camera = document.getElementById("camera");
const preview = document.getElementById("photoPreview");
const canvas = document.getElementById("photoCanvas");
const message = document.getElementById("message");
const loading = document.getElementById("loading");
const submitButton = document.getElementById("submitButton");

// START CAMERA
async function startCamera() {
    stopCamera();

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {
        alert("Camera requires HTTPS or localhost.");
        return;
    }

    try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: false
        });

        camera.srcObject = cameraStream;
        camera.style.display = "block";
        preview.style.display = "none";

        await camera.play();
    } catch (error) {
        console.error(error);
        stopCamera();
        alert("Camera permission denied or camera unavailable.");
    }
}

// CAPTURE PHOTO
function capturePhoto() {
    if (!cameraStream) {
        alert("Please open the camera first.");
        return;
    }

    if (!camera.videoWidth || !camera.videoHeight) {
        alert("Camera is not ready. Please wait.");
        return;
    }

    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    const context = canvas.getContext("2d");
    context.drawImage(camera, 0, 0, canvas.width, canvas.height);

    // Full Base64 Data URL
    photoData = canvas.toDataURL("image/jpeg", 0.8);

    preview.src = photoData;
    preview.style.display = "block";
    camera.style.display = "none";

    stopCamera();

    message.textContent = "Photo captured successfully.";
    message.style.color = "green";
}

// STOP CAMERA
function stopCamera() {
    if (cameraStream) {
        cameraStream.getTracks().forEach(function(track) {
            track.stop();
        });
        cameraStream = null;
    }

    camera.srcObject = null;
}

// RETAKE PHOTO
function retakePhoto() {
    if (isSubmitting) return;

    photoData = "";
    preview.removeAttribute("src");
    preview.style.display = "none";
    message.textContent = "";

    startCamera();
}

// GET LOCATION
function getLocation() {
    const status = document.getElementById("locationStatus");

    if (!navigator.geolocation) {
        status.textContent = "Location is not supported.";
        return;
    }

    status.textContent = "Getting current location...";

    navigator.geolocation.getCurrentPosition(
        function(position) {
            document.getElementById("latitude").value =
                position.coords.latitude;
            document.getElementById("longitude").value =
                position.coords.longitude;

            status.textContent =
                "Location captured: " +
                position.coords.latitude.toFixed(6) + ", " +
                position.coords.longitude.toFixed(6);
        },
        function(error) {
            const errors = {
                1: "Location permission denied.",
                2: "Location unavailable.",
                3: "Location request timed out."
            };

            status.textContent =
                errors[error.code] || "Unable to get location.";
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }
    );
}

// CLEAR CAMERA AND LOCATION
function clearCaptureState() {
    stopCamera();
    photoData = "";

    preview.removeAttribute("src");
    preview.style.display = "none";
    camera.style.display = "none";

    canvas.width = 0;
    canvas.height = 0;

    document.getElementById("latitude").value = "";
    document.getElementById("longitude").value = "";
    document.getElementById("locationStatus").textContent =
        "Location not captured";
}

// RESET
form.addEventListener("reset", function(event) {
    if (isSubmitting) {
        event.preventDefault();
        return;
    }

    clearCaptureState();
    message.textContent = "";
    loading.style.display = "none";
});

// SUBMIT
form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (isSubmitting) return;

    const getValue = function(id) {
        return document.getElementById(id).value.trim();
    };

    const mobile = getValue("mobile");
    const pincode = getValue("pincode");

    if (!/^[0-9]{10}$/.test(mobile)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    if (pincode && !/^[0-9]{6}$/.test(pincode)) {
        alert("Please enter a valid 6-digit PIN code.");
        return;
    }

    if (!photoData) {
        alert("Please capture the applicant photo first.");
        return;
    }

    const formData = new URLSearchParams();

    formData.append("action", "save");
    formData.append("fullName", getValue("fullName"));
    formData.append("fatherName", getValue("fatherName"));
    formData.append("dob", getValue("dob"));
    formData.append("gender", getValue("gender"));
    formData.append("mobile", mobile);
    formData.append("email", getValue("email"));
    formData.append("address", getValue("address"));
    formData.append("city", getValue("city"));
    formData.append("district", getValue("district"));
    formData.append("pincode", pincode);
    formData.append("occupation", getValue("occupation"));
    formData.append("remarks", getValue("remarks"));
    formData.append("latitude", getValue("latitude"));
    formData.append("longitude", getValue("longitude"));

    // Send the complete Data URL to Apps Script.
    formData.append("photoData", photoData);

    isSubmitting = true;
    submitButton.disabled = true;
    loading.style.display = "block";
    message.textContent = "";

    try {
        const response = await fetch(SCRIPT_URL, {
            method: "POST",
            headers: {
                "Content-Type":
                    "application/x-www-form-urlencoded;charset=UTF-8"
            },
            body: formData.toString()
        });

        const responseText = await response.text();
        let data;

        try {
            data = JSON.parse(responseText);
        } catch (error) {
            console.error("Server response:", responseText);
            throw new Error(
                "Invalid server response. Check Apps Script deployment and response."
            );
        }

        if (!response.ok) {
            throw new Error("HTTP error: " + response.status);
        }

        if (data.status !== "success") {
            throw new Error(data.message || "KYC submission failed.");
        }

        form.reset();
        clearCaptureState();

        message.textContent =
            "Success: " +
            (data.message || "KYC data and photo saved successfully.");

        message.style.color = "green";

    } catch (error) {
        console.error("Submission error:", error);

        message.textContent = "Error: " + error.message;
        message.style.color = "red";

    } finally {
        loading.style.display = "none";
        submitButton.disabled = false;
        isSubmitting = false;
    }
});

window.addEventListener("pagehide", stopCamera);
</script>

</body>
</html>
