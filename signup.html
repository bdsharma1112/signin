<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            text-align: center;
        }


        .signup-box {

            background: white;

            width: 400px;

            max-width: 90%;

            margin: 30px auto;

            padding: 25px;

            border-radius: 10px;

            box-shadow: 0 0 10px #aaa;
        }


        input,
        textarea {

            width: 95%;

            padding: 10px;

            margin: 8px 0;

            border: 1px solid #999;

            border-radius: 5px;

            box-sizing: border-box;

            font-size: 15px;
        }


        textarea {

            height: 80px;

            resize: vertical;
        }


        button {

            padding: 12px 25px;

            margin: 10px 5px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            font-size: 15px;
        }


        .create-btn {

            background: #4CAF50;

            color: white;
        }


        .create-btn:disabled {

            background: #999;

            cursor: not-allowed;
        }


        .back-btn {

            background: red;

            color: white;
        }


        /* =========================
           DELAY / LOADING ANIMATION
           ========================= */

        #delayAnimation {

            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(255,255,255,0.95);

            z-index: 9999;

            justify-content: center;

            align-items: center;

            flex-direction: column;
        }


        .loader {

            width: 50px;

            height: 50px;

            border: 5px solid #ddd;

            border-top: 5px solid #2196F3;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }


        @keyframes spin {

            0% {

                transform: rotate(0deg);

            }

            100% {

                transform: rotate(360deg);

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         SIGN UP FORM
         ========================= -->

    <div class="signup-box">

        <h2>SIGN UP</h2>


        <input
            type="text"
            id="fullName"
            placeholder="Full Name">


        <input
            type="text"
            id="fatherName"
            placeholder="Father's Name">


        <input
            type="tel"
            id="mobile"
            placeholder="Mobile No.">


        <input
            type="email"
            id="email"
            placeholder="Email ID">


        <textarea
            id="address"
            placeholder="Address"></textarea>


        <input
            type="text"
            id="signupUserId"
            placeholder="Create User ID">


        <input
            type="password"
            id="signupPassword"
            placeholder="Create Password">


        <br>


        <button
            type="button"
            class="create-btn"
            onclick="createAccount()">

            CREATE ACCOUNT

        </button>


        <button
            type="button"
            class="back-btn"
            onclick="window.location.href='index.html'">

            BACK TO LOGIN

        </button>

    </div>



    <!-- =========================
         DELAY ANIMATION
         ========================= -->

    <div id="delayAnimation">

        <div class="loader"></div>

        <h3>Please Wait...</h3>

        <p>Submitting your information...</p>

    </div>



    <script>


        // =========================
        // GOOGLE APPS SCRIPT URL
        // =========================

        const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxXlGnTpTAKkSv_cHnH7n1CcQpnns_tXGglecg6kP6mAiHguAqCFrxLJbfCo0HHKwxAMg/exec";



        // =========================
        // CREATE ACCOUNT
        // =========================

        function createAccount() {


            // GET ALL VALUES

            var fullName =
                document.getElementById("fullName").value.trim();


            var fatherName =
                document.getElementById("fatherName").value.trim();


            var mobile =
                document.getElementById("mobile").value.trim();


            var email =
                document.getElementById("email").value.trim();


            var address =
                document.getElementById("address").value.trim();


            var userId =
                document.getElementById("signupUserId").value.trim();


            var password =
                document.getElementById("signupPassword").value.trim();



            // =========================
            // CHECK ALL FIELDS
            // =========================

            if (
                fullName === "" ||
                fatherName === "" ||
                mobile === "" ||
                email === "" ||
                address === "" ||
                userId === "" ||
                password === ""
            ) {

                alert("Please fill all fields");

                return;
            }



            // =========================
            // CREATE BUTTON
            // =========================

            var createButton =
                document.querySelector(".create-btn");



            // =========================
            // SHOW DELAY ANIMATION
            // =========================

            document.getElementById("delayAnimation")
                .style.display = "flex";



            // =========================
            // DISABLE BUTTON
            // =========================

            createButton.disabled = true;

            createButton.innerText =
                "Submitting...";



            // =========================
            // CREATE URL
            // =========================

            var url =
                SCRIPT_URL +
                "?action=signup" +
                "&fullName=" +
                encodeURIComponent(fullName) +
                "&fatherName=" +
                encodeURIComponent(fatherName) +
                "&mobile=" +
                encodeURIComponent(mobile) +
                "&email=" +
                encodeURIComponent(email) +
                "&address=" +
                encodeURIComponent(address) +
                "&userId=" +
                encodeURIComponent(userId) +
                "&password=" +
                encodeURIComponent(password);



            // =========================
            // SEND DATA
            // =========================

            fetch(url)

                .then(function(response) {

                    return response.json();

                })


                .then(function(data) {


                    // =========================
                    // SUCCESS
                    // =========================

                    if (data.status === "success") {


                        // HIDE ANIMATION

                        document.getElementById(
                            "delayAnimation"
                        ).style.display = "none";


                        // SUCCESS MESSAGE

                        alert(
                            "Account Created Successfully"
                        );


                        // GO TO LOGIN PAGE

                        window.location.href =
                            "index.html";

                    }


                    // =========================
                    // ERROR
                    // =========================

                    else {


                        // HIDE ANIMATION

                        document.getElementById(
                            "delayAnimation"
                        ).style.display = "none";


                        // ENABLE BUTTON

                        createButton.disabled =
                            false;


                        createButton.innerText =
                            "CREATE ACCOUNT";


                        alert(data.message);

                    }

                })


                // =========================
                // CONNECTION ERROR
                // =========================

                .catch(function(error) {


                    // HIDE ANIMATION

                    document.getElementById(
                        "delayAnimation"
                    ).style.display = "none";


                    // ENABLE BUTTON

                    createButton.disabled =
                        false;


                    createButton.innerText =
                        "CREATE ACCOUNT";


                    console.log(error);


                    alert(
                        "Connection Error"
                    );

                });

        }

    </script>


</body>

</html>
