
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #07152b;
            margin: 0;
            text-align: center;
        }

        .signup-box {
            background: lightblue;
            width: 450px;
            max-width: 90%;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        input,
        textarea {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #999;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        button {
            padding: 12px 25px;
            margin: 10px 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

	


        .create-btn {
            background: #4CAF50;
            color: white;
        }

	  
        .create-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .back-btn {
            background: red;
            color: white;
        }

	button:hover {
            background: blue;
	
        /* PASSWORD MESSAGE */

        #passwordMessage {
            font-weight: bold;
            margin: 5px;
        }

        .match {
            color: green;
        }

        .not-match {
            color: red;
        }

        /* LOADING */

        #delayAnimation {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 5px solid #ddd;
            border-top: 5px solid #2196F3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }

    </style>

</head>

<body>


<div class="signup-box">

    <h2>Welcome</h2>


    <input
        type="text"
        id="fullName"
        placeholder="Full Name"
        required>


    

    <input
        type="tel"
        id="mobile"
        placeholder="Mobile No."
        required>


    <input
        type="email"
        id="email"
        placeholder="Email ID"
        required>



    <input
        type="text"
        id="userId"
        placeholder="Enter User ID"
        required>


    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required
        oninput="checkPassword()">


    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        required
        oninput="checkPassword()">


    <div id="passwordMessage"></div>


    <div id="message"></div>


    <br>


    <button
        type="button"
        class="create-btn"
        onclick="createAccount()">

        CREATE ACCOUNT

    </button>


    <button
        type="button"
        class="back-btn"
        onclick="window.location.href='index.html'">

        BACK TO LOGIN

    </button>

</div>



<!-- =========================
     LOADING ANIMATION
========================= -->

<div id="delayAnimation">

    <div class="loader"></div>

    <h3>Please Wait...</h3>

    <p>Submitting your information...</p>

</div>



<script>


// =================================
// GOOGLE APPS SCRIPT URL
// =================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxXlGnTpTAKkSv_cHnH7n1CcQpnns_tXGglecg6kP6mAiHguAqCFrxLJbfCo0HHKwxAMg/exec";



// =================================
// CHECK PASSWORD
// =================================

function checkPassword() {

    var password =
        document.getElementById("password").value;

    var confirmPassword =
        document.getElementById("confirmPassword").value;

    var message =
        document.getElementById("passwordMessage");


    if (confirmPassword === "") {

        message.innerHTML = "";

        return false;

    }


    if (password === confirmPassword) {

        message.innerHTML =
            "✓ Password Matched";

        message.className =
            "match";

        return true;

    }

    else {

        message.innerHTML =
            "✗ Password Not Matched";

        message.className =
            "not-match";

        return false;

    }

}



// =================================
// CREATE ACCOUNT
// =================================

function createAccount() {


    // =================================
    // GET VALUES
    // =================================

    var fullName =
        document.getElementById("fullName")
        .value.trim();


     var mobile =
        document.getElementById("mobile")
        .value.trim();


    var email =
        document.getElementById("email")
        .value.trim();


   
    var userId =
        document.getElementById("userId")
        .value.trim();


    var password =
        document.getElementById("password")
        .value;


    var confirmPassword =
        document.getElementById("confirmPassword")
        .value;



    // =================================
    // CHECK EMPTY FIELDS
    // =================================

    if (
        fullName === "" ||
        mobile === "" ||
        email === "" ||
        userId === "" ||
        password === "" ||
        confirmPassword === ""
    ) {

        alert("Please fill all fields");

        return;

    }



    // =================================
    // CHECK PASSWORD
    // =================================

    if (password !== confirmPassword) {

        alert("Password and Confirm Password do not match");

        document
            .getElementById("confirmPassword")
            .focus();

        return;

    }



    // =================================
    // CREATE BUTTON
    // =================================

    var createButton =
        document.querySelector(".create-btn");



    // =================================
    // SHOW LOADING
    // =================================

    document
        .getElementById("delayAnimation")
        .style.display = "flex";



    // =================================
    // DISABLE BUTTON
    // =================================

    createButton.disabled = true;

    createButton.innerText =
        "Submitting...";



    // =================================
    // CREATE URL
    // =================================

    var url =
        SCRIPT_URL +
        "?action=signup" +
        "&fullName=" +
        encodeURIComponent(fullName) +
        "&mobile=" +
        encodeURIComponent(mobile) +
        "&email=" +
        encodeURIComponent(email) +
        "&userId=" +
        encodeURIComponent(userId) +
        "&password=" +
        encodeURIComponent(password);



    // =================================
    // SEND DATA
    // =================================

    fetch(url)

        .then(function(response) {

            return response.json();

        })


        .then(function(data) {


            // =================================
            // SUCCESS
            // =================================

            if (data.status === "success") {


                document
                    .getElementById("delayAnimation")
                    .style.display = "none";


                alert(
                    "Account Created Successfully"
                );


                window.location.href =
                    "index.html";

            }


            // =================================
            // ERROR
            // =================================

            else {


                document
                    .getElementById("delayAnimation")
                    .style.display = "none";


                createButton.disabled =
                    false;


                createButton.innerText =
                    "CREATE ACCOUNT";


                alert(
                    data.message ||
                    "Unable to create account"
                );

            }

        })


        // =================================
        // CONNECTION ERROR
        // =================================

        .catch(function(error) {


            document
                .getElementById("delayAnimation")
                .style.display = "none";


            createButton.disabled =
                false;


            createButton.innerText =
                "CREATE ACCOUNT";


            console.log(error);


            alert(
                "Connection Error"
            );

        });

}

</script>


</body>

</html>
