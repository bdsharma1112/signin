
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ankit Telecommunication - Login</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    background: #07152b;
    padding: 20px;
}

.liquid {
    position: fixed;
    width: 700px;
    height: 700px;
    border-radius: 45% 55% 60% 40%;
    background: linear-gradient(green, red, yellow);
    opacity: 0.65;
    filter: blur(2px);
    animation: liquidMove 8s ease-in-out infinite;
    pointer-events: none;
}

.liquid::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    top: -120px;
    left: 180px;
    border-radius: 60% 40% 45% 55%;
    background: linear-gradient(135deg, pink, #4facfe);
    opacity: 0.55;
}

.liquid::after {
    content: "";
    position: absolute;
    width: 500px;
    height: 500px;
    left: -180px;
    bottom: -100px;
    border-radius: 40% 60% 55% 45%;
    background: #00c6ff;
    opacity: 0.4;
}

@keyframes liquidMove {
    0% {
        transform: translate(-250px,-100px) rotate(0deg);
    }
    50% {
        transform: translate(250px,120px) rotate(180deg);
    }
    100% {
        transform: translate(-250px,-100px) rotate(360deg);
    }
}

.login-box {
    position: relative;
    z-index: 10;
    width: 380px;
    max-width: 100%;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    text-align: center;
    color: white;
}

h2 {
    margin-top: 0;
    font-size: 25px;
}

.subtitle {
    opacity: 0.8;
    margin-bottom: 25px;
}

.input-box {
    margin-bottom: 16px;
}

.input-box input {
    width: 100%;
    padding: 13px;
    border: none;
    outline: none;
    border-radius: 8px;
    font-size: 15px;
    background: rgba(255,255,255,0.95);
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg,#00c6ff,#0072ff);
    color: pink;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}


button:hover {
    opacity: 0.9;
}
button:hover {
            background: green;
	}

.link {
    display: block;
    margin-top: 17px;
    color: black;
    cursor: pointer;
    text-decoration: underline;
    font-size: 12px;
	background:bule;
}

.hidden {
    display: none;
}

.message {
    margin-top: 15px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

#loading {
    display: none;
    margin-top: 15px;
}

.spinner {
    width: 30px;
    height: 30px;
    border: 4px solid rgba(255,255,255,0.3);
    border-top: 4px solid white;
    border-radius: 50%;
    margin: auto;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

@media(max-width:500px) {
    .login-box {
        padding: 23px;
    }

    .liquid {
        width: 500px;
        height: 500px;
    }
}

</style>
</head>

<body>

<div class="liquid"></div>

<div class="login-box">

    <!-- LOGIN SECTION -->

    <div id="loginSection">

        <h2>Ankit Telecommunication</h2>

        <p class="subtitle">User Login</p>

        <div class="input-box">
            <input
                type="text"
                id="userId"
                placeholder="User ID"
                autocomplete="username">
        </div>

        <div class="input-box">
            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password">
        </div>

        <button id="loginBtn" onclick="loginUser()">
            LOGIN
        </button>
		
        <span class="link" onclick="showForgot()">
            Forgot Password?
        </span>

        <span class="link"
              onclick="window.location.href='signup.html'">
           if you have not a account please click here for Create New Account
        </span>

    </div>


    <!-- FORGOT PASSWORD SECTION -->

    <div id="forgotSection" class="hidden">

        <h2>Forgot Password</h2>

        <p class="subtitle">
            Enter Your Registered Email ID
        </p>

        <div class="input-box">

            <input
                type="email"
                id="forgotEmail"
                placeholder="Registered Email ID"
                autocomplete="email">

        </div>

        <button onclick="sendOTP()" id="otpBtn">
            SEND OTP
        </button>

        <span class="link" onclick="showLogin()">
            Back to Login
        </span>

        <div id="otpMessage" class="message"></div>

    </div>


    <!-- RESET PASSWORD SECTION -->

    <div id="resetSection" class="hidden">

        <h2>Reset Password</h2>

        <p class="subtitle">
            Enter Email OTP and New Password
        </p>

        <div class="input-box">

            <input
                type="text"
                id="otp"
                placeholder="Enter 6 Digit OTP"
                maxlength="6"
                inputmode="numeric">
        </div>

        <div class="input-box">

            <input
                type="password"
                id="newPassword"
                placeholder="New Password (Minimum 8 Characters)"
                autocomplete="new-password">
        </div>

        <div class="input-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm New Password"
                autocomplete="new-password">
        </div>

        <button onclick="resetPassword()" id="resetBtn">
            RESET PASSWORD
        </button>

        <span class="link" onclick="showForgot()">
            Resend OTP
        </span>

        <span class="link" onclick="showLogin()">
            Back to Login
        </span>

        <div id="resetMessage" class="message"></div>

    </div>


    <div id="loading">
        <div class="spinner"></div>
        <p>Please Wait...</p>
    </div>

</div>


<script>

// ======================================
// APPS SCRIPT WEB APP URL
// ======================================

var SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzmcMG7RnMuQdvbUTNZ6sLtG5u9XvrKfyeF5GU1O1dNx8P0dgbzCNDR9PBdenEzzFfIsA/exec";


// ======================================
// SHOW / HIDE SECTIONS
// ======================================

function hideAll() {

    document.getElementById("loginSection").classList.add("hidden");

    document.getElementById("forgotSection").classList.add("hidden");

    document.getElementById("resetSection").classList.add("hidden");

}

function showLogin() {

    hideAll();

    document.getElementById("loginSection").classList.remove("hidden");

}

function showForgot() {

    hideAll();

    document.getElementById("forgotSection").classList.remove("hidden");

}

function showReset() {

    hideAll();

    document.getElementById("resetSection").classList.remove("hidden");

}


// ======================================
// LOADING
// ======================================

function setLoading(show) {

    document.getElementById("loading").style.display =
        show ? "block" : "none";

}


// ======================================
// LOGIN
// ======================================

function loginUser() {

    var userId = document.getElementById("userId").value.trim();

    var password = document.getElementById("password").value;

    if (!userId || !password) {
        alert("Please enter User ID and Password");
        return;
    }

    setLoading(true);

    var url = SCRIPT_URL +
        "?action=login" +
        "&userId=" + encodeURIComponent(userId) +
        "&password=" + encodeURIComponent(password);

    fetch(url)

    .then(function(response) {
        return response.json();
    })

    .then(function(data) {

        setLoading(false);

        if (data.status === "success") {

            sessionStorage.setItem("loginStatus","success");

            sessionStorage.setItem("userId",data.userId);

            sessionStorage.setItem("fullName",data.fullName);

            window.location.href = "home.html";

        } else {

            alert(data.message || "Invalid Login");

        }

    })

    .catch(function(error) {

        setLoading(false);

        console.log(error);

        alert("Connection Error");

    });

}


// ======================================
// SEND EMAIL OTP
// ======================================

function sendOTP() {

    var email = document.getElementById("forgotEmail")
        .value.trim();

    if (!email) {
        alert("Please enter Registered Email ID");
        return;
    }

    setLoading(true);

    document.getElementById("otpBtn").disabled = true;

    var url = SCRIPT_URL +
        "?action=sendotp" +
        "&email=" + encodeURIComponent(email);

    fetch(url)

    .then(function(response) {
        return response.json();
    })

    .then(function(data) {

        setLoading(false);

        document.getElementById("otpBtn").disabled = false;

        if (data.status === "success") {

            showReset();

            document.getElementById("otpMessage").textContent =
                data.message;

        } else {

            document.getElementById("otpMessage").textContent =
                data.message;

        }

    })

    .catch(function(error) {

        setLoading(false);

        document.getElementById("otpBtn").disabled = false;

        console.log(error);

        alert("Unable to send OTP. Check connection.");

    });

}


// ======================================
// RESET PASSWORD
// ======================================

function resetPassword() {

    var email = document.getElementById("forgotEmail")
        .value.trim();

    var otp = document.getElementById("otp")
        .value.trim();

    var newPassword = document.getElementById("newPassword")
        .value;

    var confirmPassword = document.getElementById("confirmPassword")
        .value;

    if (!/^[0-9]{6}$/.test(otp)) {
        alert("Enter valid 6 digit OTP");
        return;
    }

    if (newPassword.length < 8) {
        alert("Password must be at least 8 characters");
        return;
    }

    if (newPassword !== confirmPassword) {
        alert("New Password and Confirm Password do not match");
        return;
    }

    setLoading(true);

    document.getElementById("resetBtn").disabled = true;

    var url = SCRIPT_URL +
        "?action=resetpassword" +
        "&email=" + encodeURIComponent(email) +
        "&otp=" + encodeURIComponent(otp) +
        "&newPassword=" + encodeURIComponent(newPassword);

    fetch(url)

    .then(function(response) {
        return response.json();
    })

    .then(function(data) {

        setLoading(false);

        document.getElementById("resetBtn").disabled = false;

        document.getElementById("resetMessage").textContent =
            data.message;

        if (data.status === "success") {

            alert("Password Reset Successfully!");

            document.getElementById("otp").value = "";

            document.getElementById("newPassword").value = "";

            document.getElementById("confirmPassword").value = "";

            document.getElementById("forgotEmail").value = "";

            showLogin();

        }

    })

    .catch(function(error) {

        setLoading(false);

        document.getElementById("resetBtn").disabled = false;

        console.log(error);

        alert("Connection Error");

    });

}

</script>

</body>
</html>
