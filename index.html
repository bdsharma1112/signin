<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ankit Telecommunication</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            margin: 0;
        }

        header {
            background: #2196F3;
            color: white;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
            border: 1px solid #999;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 25px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .login-btn {
            background: #2196F3;
            color: white;
        }

        .signup-btn {
            background: #4CAF50;
            color: white;
        }
    </style>
</head>

<body>

    
    <div class="login-box">

        <h2>Sign In</h2>

        <input
            type="text"
            id="userId"
            placeholder="Enter User ID">

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <br>

        <button
            type="button"
            class="login-btn"
            onclick="login()">
            SIGN IN
        </button>

        <br>

        <button
            type="button"
            class="signup-btn"
            onclick="window.location.href='signup.html'">
            SIGN UP
        </button>


    </div>

    <script>

        const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxoaSAp8cUA89G3Y4lspGr67jUAzU00EEZH2IF5ZJYyoiYUdUlEH5Fh0SBIGJi5bw6gSw/exec";


        function login() {

            var userId =
                document.getElementById("userId").value.trim();

            var password =
                document.getElementById("password").value.trim();


            if (userId === "" || password === "") {

                alert("Please enter User ID and Password");

                return;
            }


            var url =
                SCRIPT_URL +
                "?action=login" +
                "&userId=" +
                encodeURIComponent(userId) +
                "&password=" +
                encodeURIComponent(password);


            fetch(url)

                .then(function(response) {
                    return response.json();
                })

                .then(function(data) {

                    if (data.status === "success") {

                        alert("Login Successful");

                        window.location.href = "home.html";

                    } else {

                        alert(data.message);

                    }

                })

                .catch(function(error) {

                    console.error(error);

                    alert("Connection Error");

                });
        }

    </script>

</body>
</html>
