<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Ankit Telecommunication</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            margin: 0;
        }


        header {
            background: #222;
            color: white;
            padding: 30px;
        }


        .form-box {
            background: white;
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }


        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-weight: bold;
        }


        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }


        button {
            color: blue;
            background: yellow;
            border: 1px solid blue;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }


        button:hover {
            background: orange;
        }


        .back {
            background: #ddd;
            color: black;
        }

    </style>

</head>


<body>


    <header>

        <h1>
            Ankit Telecommunication
        </h1>

        <p>
            Create New Account
        </p>

    </header>



    <div class="form-box">

        <h2>Sign Up</h2>


        <label for="fullName">
            Full Name
        </label>

        <input
            type="text"
            id="fullName"
            placeholder="Enter Full Name"
        >


        <label for="fatherName">
            Father's Name
        </label>

        <input
            type="text"
            id="fatherName"
            placeholder="Enter Father's Name"
        >


        <label for="mobile">
            Mobile No
        </label>

        <input
            type="tel"
            id="mobile"
            placeholder="Enter Mobile No"
        >


        <label for="email">
            Email ID
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter Email ID"
        >


        <label for="address">
            Address
        </label>

        <input
            type="text"
            id="address"
            placeholder="Enter Full Address"
        >


        <label for="userId">
            New User ID
        </label>

        <input
            type="text"
            id="userId"
            placeholder="Enter New User ID"
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >


        <button
            type="button"
            onclick="signUp()">

            CREATE ACCOUNT

        </button>


        <br>


        <button
            type="button"
            class="back"
            onclick="window.location.href='index.html'">

            BACK TO LOGIN

        </button>

    </div>



    <script>


        var scriptURL =
        ""https://script.google.com/macros/s/AKfycbxoaSAp8cUA89G3Y4lspGr67jUAzU00EEZH2IF5ZJYyoiYUdUlEH5Fh0SBIGJi5bw6gSw/exec";



        function signUp() {


            var fullName =
                document.getElementById("fullName")
                .value.trim();


            var fatherName =
                document.getElementById("fatherName")
                .value.trim();


            var mobile =
                document.getElementById("mobile")
                .value.trim();


            var email =
                document.getElementById("email")
                .value.trim();


            var address =
                document.getElementById("address")
                .value.trim();


            var userId =
                document.getElementById("userId")
                .value.trim();


            var password =
                document.getElementById("password")
                .value.trim();



            if (
                fullName === "" ||
                fatherName === "" ||
                mobile === "" ||
                email === "" ||
                address === "" ||
                userId === "" ||
                password === ""
            ) {

                alert("Please fill all fields");

                return;
            }



            var url =
                scriptURL +
                "?action=signup" +

                "&fullName=" +
                encodeURIComponent(fullName) +

                "&fatherName=" +
                encodeURIComponent(fatherName) +

                "&mobile=" +
                encodeURIComponent(mobile) +

                "&email=" +
                encodeURIComponent(email) +

                "&address=" +
                encodeURIComponent(address) +

                "&userId=" +
                encodeURIComponent(userId) +

                "&password=" +
                encodeURIComponent(password);



            fetch(url)

            .then(function(response) {

                return response.json();

            })


            .then(function(result) {


                if (result.status === "success") {


                    alert(
                        "Account Created Successfully"
                    );


                    // वापस Login page

                    window.location.href =
                        "index.html";


                }

                else {

                    alert(result.message);

                }

            })


            .catch(function(error) {

                console.log(error);

                alert(
                    "Error connecting to Google Sheet"
                );

            });

        }

    </script>


</body>

</html>
