<div class="search-box">

    <input
        type="text"
        id="searchText"
        placeholder="Search Name, Mobile, Email, User ID...">

    <button
        type="button"
        onclick="searchData()">

        SEARCH By FIELDS

    </button>

</div>

<div id="searchResult"></div>

<script>       
var SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbwNO8g4yRTdfdhibWBzF6YumvNDTpKOHYKnQJWzkFc7sT-n-tcprm-djygAmqVD_24uDw/exec";


function searchData() {

    var searchText =
        document.getElementById("searchText")
        .value.trim();

    if (searchText === "") {

        alert("Please enter search value");

        return;
    }


    var url =
        SCRIPT_URL +
        "?action=search" +
        "&search=" +
        encodeURIComponent(searchText);


    fetch(url)

    .then(function(response) {

        return response.json();

    })

    .then(function(data) {

        if (data.status === "success") {

            var html = "";

            data.records.forEach(function(row) {

                html +=
                    "<div>" +

                    "<b>Full Name:</b> " +
                    row.fullName + "<br>" +

                    "<b>Father Name:</b> " +
                    row.fatherName + "<br>" +

                    "<b>Mobile:</b> " +
                    row.mobile + "<br>" +

                    "<b>Email:</b> " +
                    row.email + "<br>" +

                    "<b>Address:</b> " +
                    row.address + "<br>" +

                    "<b>User ID:</b> " +
                    row.userId + "<hr>" +

                    "</div>";

            });


            document.getElementById("searchResult")
                .innerHTML = html;

        }

        else {

            document.getElementById("searchResult")
                .innerHTML =
                "<h3>No Record Found</h3>";

        }

    })

    .catch(function(error) {

        console.log(error);

        alert("Connection Error");

    
</body>
