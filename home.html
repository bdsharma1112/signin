
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ankit Telecommunication</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            margin: 0;
        }


        header {
            background: #222;
            color: white;
            padding: 30px;
        }


        .form-box {
            background: white;
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #aaa;
        }


        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            font-weight: bold;
        }


        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 5px;
        }


        button {
            color: blue;
            background: yellow;
            border: 1px solid blue;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }


        button:hover {
            background: orange;
        }


        .back {
            background: #ddd;
            color: black;
        }

    </style>

</head>


<body>


    <header>

        <h1>
            Ankit Telecommunication
        </h1>

        <p>
            Reports
        </p>

    </header>



    <div class="form-box">

        <h2>Sign Up</h2>


        
        <button
            type="button"
            class="report"
            onclick="window.location.href='Report.html'">
    
           
           VIEW REPORT

        </button>


        <br>


        <button
            type="button"
            class="back"
            onclick="window.location.href='home.html'">

            BACK TO LOGIN

        </button>

    
</body>

</html>
